<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doodh Bahi — milk ledger</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="signed-out" class="wrap" style="display:none">
    <h1>Doodh Bahi</h1>
    <p class="muted">Sign in to keep your milk ledger synced across devices.</p>
    <button id="sign-in-btn" class="btn-primary">Sign in with Google</button>
  </div>

  <div id="app" class="wrap" style="display:none">
    <div class="top-row">
      <button id="prev-month" aria-label="Previous month" class="nav-btn">&#8592;</button>
      <span id="month-label" class="month-label"></span>
      <button id="next-month" aria-label="Next month" class="nav-btn">&#8594;</button>
    </div>

    <div id="weekday-row" class="weekday-row"></div>
    <div id="calendar" class="calendar"></div>

    <div class="day-section">
      <div id="day-label" class="day-label"></div>
      <div id="quick-values" class="quick-values"></div>
    </div>

    <div class="totals-row">
      <span id="total-litres" class="muted"></span>
      <span id="total-amount" class="amount"></span>
    </div>

    <div id="error" class="error"></div>

    <div class="footer-row">
      <span id="rate-display" class="muted small link"></span>
      <span id="rate-edit" class="rate-edit" style="display:none">
        Rate per litre &#8377;
        <input id="rate-input" type="text" inputmode="decimal" />
      </span>
      <button id="sign-out-btn" class="muted small link" style="float:right; border:none; background:none; cursor:pointer;">Sign out</button>
    </div>

    <div id="loading" class="muted small" style="display:none">Loading…</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
